name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_call:
    inputs:
      fork_release:
        description: Stamp an always-increasing version for the fork's nightly release
        type: boolean
        default: false
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  test:
    name: Test header fix (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install GNUstep
        run: sudo apt-get update && sudo apt-get install -y clang libgnustep-base-dev gobjc
      - name: Run test
        run: sh .github/tests/run_mme_client_info_test.sh

  build:
    name: Build using xcodebuild command
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Prepare Dependencies
        env:
          FORK_RELEASE: ${{ inputs.fork_release }}
        run: |
          sh .github/prepare_dependencies.sh
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | tee xcodebuild.log | xcpretty && exit ${PIPESTATUS[0]}
      - name: Upload raw build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild.log
          path: xcodebuild.log
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Find SideStore commit
        id: sidestore
        if: github.repository != 'LiveContainer/LiveContainer'
        run: |
          commit=$(git ls-remote https://github.com/LiveContainer/SideStore.git refs/heads/LiveContainerSupport | cut -f1)
          echo "commit=$commit" >> $GITHUB_OUTPUT
          echo "key=sidestore-ipa-$commit-${{ hashFiles('SideStorePatches/**', '.github/build_sidestore.sh') }}" >> $GITHUB_OUTPUT
      - name: Reuse SideStore built from the same source
        if: github.repository != 'LiveContainer/LiveContainer' && steps.sidestore.outputs.commit != ''
        uses: actions/cache@v4
        with:
          path: sidestore-cache
          key: ${{ steps.sidestore.outputs.key }}
      - name: Create IPA
        env:
          SIDESTORE_COMMIT: ${{ steps.sidestore.outputs.commit }}
          SIDESTORE_CACHE_KEY: ${{ steps.sidestore.outputs.key }}
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    # forks publish with fork-release.yml instead
    if: github.repository == 'LiveContainer/LiveContainer' && (inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
