name: Fork - Build and Release Nightly

# Builds this fork and publishes it as the "nightly" release on this fork only,
# with an AltSource (apps_fork.json) that built-in SideStore uses to update LiveContainer.
# Started by sync.yml whenever main, SideStore's source or the SideStore nightly changes.

on:
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'LiveContainer/LiveContainer'
    # build.yml's upstream-only release job asks for contents: write, even though it is skipped here
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      fork_release: true

  release:
    name: Publish nightly release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # the commit the build job built, even if main moved on meanwhile
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts
      - name: Download LiveContainer+SideStore.ipa
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
          path: artifacts
      - name: Collect IPA files
        run: |
          # each artifact may unpack as a file or as a folder holding the file
          for name in "LiveContainer.ipa" "LiveContainer+SideStore.ipa"; do
            file=$(find artifacts -type f -name "$name" | head -1)
            [ -n "$file" ] || { echo "::error::$name not found in artifacts"; find artifacts; exit 1; }
            mv "$file" "./$name"
          done
          ls -l *.ipa
      - name: Collect build info
        run: |
          git remote add upstream https://github.com/LiveContainer/LiveContainer.git
          git fetch --quiet upstream main
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          echo "UPSTREAM_SHA=$(git rev-parse upstream/main)" >> $GITHUB_ENV
          asset=$(gh api repos/LiveContainer/SideStore/releases/tags/nightly \
            --jq '.assets[] | select(.name=="SideStore.ipa") | "\(.id)@\(.updated_at)"')
          echo "SIDESTORE_ASSET=$asset" >> $GITHUB_ENV
          src=$(git ls-remote https://github.com/LiveContainer/SideStore.git refs/heads/LiveContainerSupport | cut -f1)
          echo "SIDESTORE_SOURCE=$src" >> $GITHUB_ENV
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          # changes since the last nightly, for SideStore's update screen and the release notes
          last=$(gh release download --repo "$GITHUB_REPOSITORY" nightly -p build-info.json -O - 2>/dev/null | jq -r '.commit // ""' || true)
          changes=""
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            changes=$(git log --no-merges --format='- %s' "$last..HEAD" -- . ':(exclude)*.md' | head -20)
          fi
          { echo "CHANGES<<EOF_CHANGES"; echo "$changes"; echo "EOF_CHANGES"; } >> $GITHUB_ENV
      - name: Write AltSource and build info
        run: |
          python3 .github/fork_source.py "LiveContainer+SideStore.ipa" apps_fork.json
          printf '{"commit":"%s","upstream":"%s","sidestore_asset":"%s","sidestore_source":"%s"}\n' \
            "$COMMIT_SHA" "$UPSTREAM_SHA" "$SIDESTORE_ASSET" "$SIDESTORE_SOURCE" > build-info.json
          cat build-info.json
      - name: Publish release
        run: |
          if [ "$SIDESTORE_FROM_SOURCE" = true ]; then
            sidestore="SideStore source: ${SIDESTORE_SOURCE:0:7} (LiveContainer/SideStore, with SideStorePatches applied)"
          else
            sidestore="Warning: SideStore could not be built from source, so this build has the prebuilt SideStore without SideStorePatches."
          fi
          whatsnew=""
          if [ -n "$CHANGES" ]; then
            whatsnew="What's new:
          $CHANGES

          "
          fi
          notes="Version $NIGHTLY_VERSION, built from ${COMMIT_SHA:0:7}: $COMMIT_MSG

          ${whatsnew}Upstream LiveContainer: ${UPSTREAM_SHA:0:7}
          $sidestore
          Built by $RUN_URL

          The built-in SideStore updates LiveContainer from this source: https://github.com/${{ github.repository }}/releases/download/nightly/apps_fork.json"
          files="LiveContainer.ipa LiveContainer+SideStore.ipa apps_fork.json build-info.json"
          if gh release view --repo "$GITHUB_REPOSITORY" nightly >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" nightly $files --clobber
            gh release edit --repo "$GITHUB_REPOSITORY" nightly --prerelease --title "Nightly ($(date -u +%Y-%m-%d))" --notes "$notes"
          else
            gh release create --repo "$GITHUB_REPOSITORY" nightly $files --prerelease --target "$COMMIT_SHA" \
              --title "Nightly ($(date -u +%Y-%m-%d))" --notes "$notes"
          fi
      - name: Keep the last 5 builds for rollback
        run: |
          tag="build-$NIGHTLY_VERSION"
          gh release create --repo "$GITHUB_REPOSITORY" "$tag" LiveContainer.ipa LiveContainer+SideStore.ipa \
            --prerelease --target "$COMMIT_SHA" --title "Build $NIGHTLY_VERSION" \
            --notes "Kept for rollback. The current build is always the nightly release.

          $notes"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "Removing old build $old"
            gh release delete --repo "$GITHUB_REPOSITORY" "$old" --cleanup-tag --yes
          done
      - name: Close the build failure issue
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly build failed"' --json number --jq '.[].number'); do
            gh issue close --repo "$GITHUB_REPOSITORY" "$n" --comment "Fixed: $RUN_URL published $NIGHTLY_VERSION."
          done

  notify-failure:
    name: Report a failed build
    needs: [build, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update an issue
        run: |
          title="Nightly build failed"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$n" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The nightly build or release failed: $RUN_URL

          The previous nightly is still published. This issue closes itself after the next successful build."
          fi
