name: Fork - Sync Upstream

# Every hour: merge new commits from LiveContainer/LiveContainer into this fork's main,
# and rebuild when upstream, SideStore's source or its nightly changed since the last
# fork release. Opens an issue on this fork when a merge needs a person.

on:
  schedule:
    # hourly: GitHub delays or drops scheduled runs under load (it skipped a whole day here),
    # and a run that finds nothing to do takes seconds
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'LiveContainer/LiveContainer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LiveContainer/LiveContainer.git
          git fetch --quiet upstream main
          before=$(git rev-parse HEAD)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "result=uptodate" >> $GITHUB_OUTPUT
          elif ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "result=conflict" >> $GITHUB_OUTPUT
          elif git diff --name-only "$before" HEAD | grep -q '^\.github/workflows/'; then
            # the workflow token may not push changes to workflow files
            git reset --quiet --hard "$before"
            echo "result=workflows" >> $GITHUB_OUTPUT
          else
            git push origin HEAD
            echo "result=merged" >> $GITHUB_OUTPUT
          fi
          echo "upstream=$(git rev-parse upstream/main)" >> $GITHUB_OUTPUT

      - name: Ask for a manual merge
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'workflows'
        run: |
          title="Upstream sync needs a manual merge"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "Issue already open."; exit 0
          fi
          if [ "${{ steps.merge.outputs.result }}" = conflict ]; then
            why="Merging upstream LiveContainer/LiveContainer@${{ steps.merge.outputs.upstream }} into main has conflicts."
          else
            why="Upstream LiveContainer/LiveContainer@${{ steps.merge.outputs.upstream }} changes files in .github/workflows, which the workflow token is not allowed to push."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$why

          Run on your computer:
          \`\`\`
          git remote add upstream https://github.com/LiveContainer/LiveContainer.git
          git fetch upstream main
          git merge upstream/main
          git push
          \`\`\`
          Then close this issue. Builds keep using the last merged version until then."

      - name: Decide whether to rebuild
        id: check
        run: |
          current_ss=$(gh api repos/LiveContainer/SideStore/releases/tags/nightly \
            --jq '.assets[] | select(.name=="SideStore.ipa") | "\(.id)@\(.updated_at)"')
          current_src=$(git ls-remote https://github.com/LiveContainer/SideStore.git refs/heads/LiveContainerSupport | cut -f1)
          head=$(git rev-parse HEAD)
          last=$(gh release download --repo "$GITHUB_REPOSITORY" nightly -p build-info.json -O - 2>/dev/null || echo '{}')
          last_commit=$(echo "$last" | jq -r '.commit // ""')
          last_ss=$(echo "$last" | jq -r '.sidestore_asset // ""')
          last_src=$(echo "$last" | jq -r '.sidestore_source // ""')
          echo "main: $head (last release: $last_commit)"
          echo "SideStore nightly: $current_ss (last release: $last_ss)"
          echo "SideStore source: $current_src (last release: $last_src)"
          code_changed=false
          if [ "$head" != "$last_commit" ]; then
            # a change that only touches Markdown files doesn't need a new build
            if [ -z "$last_commit" ] || ! git cat-file -e "$last_commit^{commit}" 2>/dev/null \
                || git diff --name-only "$last_commit" "$head" | grep -qv '\.md$'; then
              code_changed=true
            fi
          fi
          if [ "$code_changed" = true ] || [ "$current_ss" != "$last_ss" ] || [ "$current_src" != "$last_src" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          fi

      - name: Start fork build and release
        if: steps.check.outputs.rebuild == 'true'
        run: gh workflow run --repo "$GITHUB_REPOSITORY" fork-release.yml --ref "${{ github.event.repository.default_branch }}"
